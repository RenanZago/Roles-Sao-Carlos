<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Senha - RoleSC</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/auth.css">
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <a href="index.html" class="logo">RoleSC</a>
      </div>
    </header>

    <main class="main-content">
      <div class="container">
        <div class="form-container">
          <h1 class="page-title">Recuperar Senha</h1>
          <p style="text-align: center; margin-bottom: 32px; color: var(--cor-texto-secundario);">
            Digite seu email para receber instruções de recuperação de senha.
          </p>
          <form action="#" method="POST">
            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="seuemail@exemplo.com"
                required
              />
            </div>
            <button type="submit" class="submit-button">Enviar Instruções</button>
          </form>
          <p class="switch-form">
            Lembrou da senha? <a href="login.html">Faça login</a>
          </p>
        </div>
      </div>
    </main>

    <!-- JavaScript -->
    <script src="../js/common.js"></script>
  </body>
  </html>
