<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - RoleSC</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <a href="index.html" class="logo">RoleSC</a>
      </div>
    </header>

    <main class="main-content">
      <div class="container">
        <div class="form-container">
          <h1 class="page-title">Bem-vindo de volta!</h1>
          <form action="#" method="POST">
            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="seuemail@exemplo.com"
                required
              />
            </div>
            <div class="form-group">
              <label for="password">Senha</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Sua senha"
                  required
                />
                <span class="toggle-password">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    class="eye-icon"
                  >
                    <path
                      d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                    ></path>
                  </svg>
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    class="eye-slash-icon"
                    style="display: none"
                  >
                    <path
                      d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"
                    ></path>
                  </svg>
                </span>
              </div>
            </div>
            <div class="form-options">
              <div class="checkbox-group">
                <input type="checkbox" id="remember" name="remember" />
                <label for="remember">Lembrar de mim</label>
              </div>
              <a href="esqueci-senha.html" class="forgot-password"
                >Esqueceu a senha?</a
              >
            </div>
            <button type="submit" class="submit-button">Entrar</button>
          </form>
          <p class="switch-form">
            Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
          </p>
        </div>
      </div>
    </main>
    <script>
      document.querySelectorAll(".toggle-password").forEach((toggle) => {
        toggle.addEventListener("click", function (e) {
          const passwordInput = this.parentElement.querySelector("input");
          const eyeIcon = this.querySelector(".eye-icon");
          const eyeSlashIcon = this.querySelector(".eye-slash-icon");

          if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.style.display = "none";
            eyeSlashIcon.style.display = "block";
          } else {
            passwordInput.type = "password";
            eyeIcon.style.display = "block";
            eyeSlashIcon.style.display = "none";
          }
        });
      });
      const aForm = document.querySelector("form");
      aForm.addEventListener("submit", function (event) {
        event.preventDefault();
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
